# ─── Server ──────────────────────────────────────────────────────────────────
server.port=8080

# ─── Database ─────────────────────────────────────────────────────────────────
# All sensitive values come from environment variables — never hardcoded.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
# validate  → checks schema matches entities (use in production)
# update    → auto-alters tables to match entities (use in development only)
# create    → drops and recreates all tables on startup (dangerous!)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ─── JWT ─────────────────────────────────────────────────────────────────────
# Must be a Base64-encoded secret of at least 256 bits for HS256
jwt.secret=${JWT_SECRET}
# Token expiry in milliseconds (86400000 = 24 hours)
jwt.expiration.ms=86400000

# ─── Logging ─────────────────────────────────────────────────────────────────
logging.level.com.byteforge=DEBUG
logging.level.org.springframework.security=DEBUG
